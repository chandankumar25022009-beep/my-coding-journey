<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather UI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-container">

        <div class="weather-card">

            <h1>Weather App</h1>

            <form id="weatherForm">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <div id="weather">

                <div class="weather-icon">
                    ☀️
                </div>

                <h2 id="city">
                    New Delhi
                </h2>

                <p id="date">
                    Today
                </p>

                <div class="temperature">
                    <span id="temperature">28</span>°C
                </div>

                <p id="condition">
                    Clear Sky
                </p>

                <div class="details">

                    <div>
                        <strong id="humidity">55%</strong>
                        <span>Humidity</span>
                    </div>

                    <div>
                        <strong id="wind">12 km/h</strong>
                        <span>Wind</span>
                    </div>

                    <div>
                        <strong id="feels">30°C</strong>
                        <span>Feels Like</span>
                    </div>

                </div>

            </div>

            <p id="message"></p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
