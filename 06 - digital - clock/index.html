<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <div class="clock-card">

            <p class="label">CURRENT TIME</p>

            <div id="time">
                00:00:00
            </div>

            <div id="ampm">
                AM
            </div>

            <div id="date">
                Loading date...
            </div>

            <button id="formatButton">
                Switch to 12/24 Hour
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
